# MLX-LM LoRA config for Qwen2.5-Coder-7B-Instruct-bf16 (stability-first)
# Usage:
#   python -m mlx_lm lora -c configs/Qwen2.5-Coder-7B-Instruct-bf16.yaml
#
# Notes:
# - Stability preset for Apple Silicon / constrained unified memory.
# - If this is stable, scale up gradually (max_seq_length, num_layers, rank).

model: mlx-community/Qwen2.5-Coder-7B-Instruct-bf16
train: true
fine_tune_type: lora

# MLX-LM expects a directory containing train.jsonl + valid.jsonl.
# This repo materializes these under: lab/artifacts/
data: lab/artifacts

# Keep adapter outputs isolated from the 4-bit run.
adapter_path: lab/artifacts/Qwen2.5-Coder-7B-Instruct-bf16/checkpoints_stable

optimizer: adamw
learning_rate: 1.0e-5
iters: 800
batch_size: 1
grad_accumulation_steps: 8
max_seq_length: 512

# Conservative LoRA depth to avoid OOM in 7B bf16.
num_layers: 6

# Helps memory headroom.
grad_checkpoint: true
weight_decay: 0.01

steps_per_report: 100
steps_per_eval: 100
save_every: 100
seed: 173

lora_parameters:
  rank: 8
  scale: 8.0
  dropout: 0.0
