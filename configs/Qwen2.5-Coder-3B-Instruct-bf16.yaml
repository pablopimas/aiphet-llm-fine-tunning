model: mlx-community/Qwen2.5-Coder-3B-Instruct-bf16
train: true
fine_tune_type: lora

data: lab/artifacts
adapter_path: lab/artifacts/mlx-community-qwen2.5-coder-3b-instruct-bf16/checkpoints_stable

optimizer: adamw
learning_rate: 1e-5
iters: 800
batch_size: 1
grad_accumulation_steps: 8
